name: "AutoProver Formal Verification"
on:
  pull_request:
    branches:
      - "master"
permissions:
  pull-requests: "write"
  contents: "read"
concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true
jobs:
  ai-auditor-audit:
    runs-on: "ubuntu-latest"
    steps:
      - name: "Reject unsupported fork pull request"
        if: "${{ github.event.pull_request.head.repo.full_name != github.repository }}"
        run: "echo \"AutoProver and AutoFuzzer cannot commit generated files to fork pull requests.\"

          exit 1"
      - uses: "Certora/autoprover-guardian-ci@APSupport"
        if: "${{ github.event.pull_request.head.repo.full_name == github.repository }}"
        with:
          api-key: "${{ secrets.CERTORA_API_KEY }}"
          workflow: "auto-prover"
          contract-path: "contracts/@fhevm/host-contracts/contracts/ACL.sol"
          contract-name: "ACL"
          api-base-url: "https://dev-zeus.certora.com"
